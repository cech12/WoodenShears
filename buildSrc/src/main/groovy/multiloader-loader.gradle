plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// ---------------------------------------------------------------------------------------------------------------------
// GameTests
// The test logic lives in common/src/gametest. Each loader compiles it together with its own thin adapter
// (<loader>/src/gametest) into the "gametest" source set, which is only used by the runGameTestServer task and is
// never part of the released jar.
// ---------------------------------------------------------------------------------------------------------------------
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

configurations {
    commonGametestJava {
        canBeResolved = true
    }
    commonGametestResources {
        canBeResolved = true
    }
}

dependencies {
    commonGametestJava project(path: ':common', configuration: 'commonGametestJava')
    commonGametestResources project(path: ':common', configuration: 'commonGametestResources')
}

tasks.named('compileGametestJava', JavaCompile) {
    dependsOn(configurations.commonGametestJava)
    source(configurations.commonGametestJava)
}

tasks.named('processGametestResources', ProcessResources) {
    dependsOn(configurations.commonGametestResources)
    from(configurations.commonGametestResources)
    // separate test mods (Forge) need their own pack.mcmeta - reuse the one of the main mod to avoid duplicate pack formats
    from(project(':common').file('src/main/resources/pack.mcmeta'))
    var gametestExpandProps = ['version': version, 'mod_id': mod_id, 'mod_name': mod_name, 'mod_license': mod_license]
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'pack.mcmeta']) {
        expand gametestExpandProps
    }
    inputs.properties(gametestExpandProps)
}

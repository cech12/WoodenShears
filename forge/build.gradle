plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.accesstransformers'
    id 'net.minecraftforge.gradle'
}
jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json" //"${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.10'
}

minecraft {
    // Automatically enable forge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer.from(at.absolutePath)
    }

    runs {
        configureEach {
            args "-mixin.config=${mod_id}.mixins.json"
            //args "-mixin.config=${mod_id}.forge.mixins.json"
        }
        client {
            workingDir = file('runs/client')
        }
        server {
            workingDir = file('runs/server')
        }
        // GameTests (see TESTING.md): ./gradlew :forge:runGameTestServer
        gameTestServer {
            workingDir = file('runs/gametest')
            args '--tests', "${mod_id}:*".toString(), '--report', file('build/gametest-report.xml').absolutePath
        }
        data {
            workingDir = file('runs/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// ForgeGradle only creates run tasks for source sets that depend on Minecraft.
configurations {
    gametestImplementation.extendsFrom(implementation)
}

// ForgeGradle creates one run task per source set. Only the run of the gametest source set contains the tests, so the
// common task name runGameTestServer (used by all loaders and the CI) delegates to it.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'runGametestGameTestServer'
    enabled = false
}

sourceSets.main.resources.srcDir 'src/generated/resources'

publishing {
    publications {
        mavenJava(MavenPublication) {
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}
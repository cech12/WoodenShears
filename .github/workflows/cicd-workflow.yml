# This workflow builds the project on each push and pull request and publish it on new tags

name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
    tags: ["26*"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [ "*" ]
    paths-ignore: ["**/*.md"]

jobs:
  build:
    # build and game tests in one job: the game tests reuse the Minecraft setup and classes of the build
    name: Build
    uses: cech12/MinecraftModActions/.github/workflows/build.yml@main
    with:
      java-version: 25
      gametest: true
  server-starttest:
    needs: build
    name: Server Start Test
    uses: cech12/MinecraftModActions/.github/workflows/server-starttest.yml@feature/starttest-metadata-dependencies
    with:
      loaders: '["fabric", "forge", "neoforge"]'
      actions-ref: feature/starttest-metadata-dependencies
  publish-github:
    # only publish what passed all tests (build includes the game tests)
    needs: [ build, server-starttest ]
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish Github
    uses: cech12/MinecraftModActions/.github/workflows/multi-publish-github.yml@main
    with:
      java-version: 25
      mod-name: Wooden Shears
      mod-id: woodenshears
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
  publish-forge-on-curseforge:
    needs: publish-github
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish Forge on Curseforge
    uses: cech12/MinecraftModActions/.github/workflows/publish-curseforge.yml@main
    with:
      java-version: 25
      subproject: forge
      title-prefix: forge-
      curseforge-id: 443192
      game-versions: |
        26.3
      release-type: release
      loaders: |
        forge
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
  publish-forge-on-modrinth:
    needs: publish-github
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish Forge on Modrinth
    uses: cech12/MinecraftModActions/.github/workflows/publish-modrinth.yml@main
    with:
      java-version: 25
      subproject: forge
      title-prefix: forge-
      modrinth-id: J3VVx8dO
      game-versions: |
        26.3
      release-type: release
      loaders: |
        forge
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      modrinth-token: ${{ secrets.MODRINTH_API_KEY }}
  publish-neoforge-on-curseforge:
    needs: publish-github
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish Neoforge on Curseforge
    uses: cech12/MinecraftModActions/.github/workflows/publish-curseforge.yml@main
    with:
      java-version: 25
      subproject: neoforge
      title-prefix: neoforge-
      curseforge-id: 443192
      game-versions: |
        26.3
      release-type: release
      loaders: |
        neoforge
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
  publish-neoforge-on-modrinth:
    needs: publish-github
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish Neoforge on Modrinth
    uses: cech12/MinecraftModActions/.github/workflows/publish-modrinth.yml@main
    with:
      java-version: 25
      subproject: neoforge
      title-prefix: neoforge-
      modrinth-id: J3VVx8dO
      game-versions: |
        26.3
      release-type: release
      loaders: |
        neoforge
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      modrinth-token: ${{ secrets.MODRINTH_API_KEY }}
  publish-fabric-on-curseforge:
    needs: publish-github
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish Fabric on Curseforge
    uses: cech12/MinecraftModActions/.github/workflows/publish-curseforge.yml@main
    with:
      java-version: 25
      subproject: fabric
      title-prefix: fabric-
      curseforge-id: 443192
      game-versions: |
        26.3
      release-type: release
      loaders: |
        fabric
        quilt
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
  publish-fabric-on-modrinth:
    needs: publish-github
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish Fabric on Modrinth
    uses: cech12/MinecraftModActions/.github/workflows/publish-modrinth.yml@main
    with:
      java-version: 25
      subproject: fabric
      title-prefix: fabric-
      modrinth-id: J3VVx8dO
      game-versions: |
        26.3
      release-type: release
      loaders: |
        fabric
        quilt
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      modrinth-token: ${{ secrets.MODRINTH_API_KEY }}
